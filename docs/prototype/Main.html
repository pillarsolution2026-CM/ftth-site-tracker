<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>شاشة الكاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#e9edf1}</style>
</head>
<body style="display:flex;justify-content:center">

<div dir="rtl" style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:#0b121a;font-family:'Cairo',system-ui,sans-serif;color:#e8eef4;display:flex;flex-direction:column">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;background:#101a24;border-bottom:1px solid #1c2a38">
    <div style="display:flex;flex-direction:column;gap:2px">
      <span style="font-size:15px;font-weight:700">القطاع الأول – قليوب</span>
      <span style="font-size:12px;color:#9fb2c4">منطقة C-02 · نسخة التصميم Rev 3 (مقفولة)</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="display:flex;align-items:center;gap:6px;background:#3a2a05;color:#ffd166;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:600">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15-6.7L21 8M21 3v5h-5M21 12a9 9 0 0 1-15 6.7L3 16M3 21v-5h5"/></svg>
        3 في الانتظار
      </span>
      <button aria-label="الطبقات" style="width:44px;height:44px;border-radius:12px;border:1px solid #243445;background:#142030;color:#e8eef4;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3 3 8l9 5 9-5-9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
      </button>
    </div>
  </div>

  <div style="position:relative;flex:1;background:#0b121a">
    <svg width="390" height="520" viewBox="0 0 390 520" style="display:block" role="img" aria-label="رسمة الكاد للقطاع الأول – قليوب، المسار R-14 محدد">
      <rect width="390" height="520" fill="#0b121a"/>
      <path d="M0 140H390M0 330H390M110 0V520M280 0V520" stroke="#111b26" stroke-width="26"/>
      <g fill="#162331" stroke="#223244" stroke-width="1">
        <rect x="8" y="12" width="88" height="100"/><rect x="128" y="12" width="136" height="100"/><rect x="298" y="12" width="84" height="100"/>
        <rect x="8" y="168" width="88" height="136"/><rect x="128" y="168" width="136" height="136"/><rect x="298" y="168" width="84" height="136"/>
        <rect x="8" y="356" width="88" height="150"/><rect x="128" y="356" width="136" height="150"/><rect x="298" y="356" width="84" height="150"/>
      </g>
      <g stroke="#38bdf8" stroke-width="2" fill="none">
        <path d="M20 140H110"/><path d="M110 140H280V330"/><path d="M110 0V140"/><path d="M280 330H370"/><path d="M20 330H280"/><path d="M110 330V500" stroke-dasharray="5 4"/>
      </g>
      <g stroke="#34d399" stroke-width="3.5" fill="none" stroke-linecap="round">
        <path d="M20 140H110"/><path d="M110 0V140"/><path d="M20 330H280"/><path d="M110 140H230"/>
      </g>
      <path d="M110 140H280V330" stroke="#f2a900" stroke-opacity=".28" stroke-width="12" fill="none" stroke-linejoin="round"/>
      <g fill="#fff" stroke="#2563eb" stroke-width="2">
        <rect x="104" y="134" width="12" height="12"/><rect x="274" y="134" width="12" height="12"/><rect x="274" y="324" width="12" height="12"/>
      </g>
      <g stroke-width="1.5">
        <rect x="53" y="133" width="14" height="14" fill="#34d399" stroke="#0b121a"/>
        <rect x="193" y="323" width="14" height="14" fill="#34d399" stroke="#0b121a"/>
        <rect x="273" y="228" width="14" height="14" fill="#0b121a" stroke="#38bdf8"/>
        <circle cx="110" cy="330" r="8" fill="#0b121a" stroke="#f472b6" stroke-width="2"/>
        <path d="M370 322l8 8-8 8-8-8z" fill="#a78bfa" stroke="#0b121a"/>
      </g>
      <g font-family="ui-monospace,Consolas,monospace" font-size="10" fill="#9fc4dc" direction="ltr">
        <text x="150" y="128">F 36 C · 500.0M</text>
        <text x="288" y="190">1X2Way16/12</text>
        <text x="30" y="124">1-1 B</text>
        <text x="148" y="352">3-2 P</text>
        <text x="92" y="354" fill="#f9a8d4">HHI</text>
      </g>
      <g stroke="#ffffff" stroke-opacity=".5" stroke-width=".6"><path d="M200 120V270M150 195H260"/></g>
      <g>
        <rect x="132" y="160" width="136" height="24" rx="12" fill="#f2a900"/>
        <text x="200" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#2a1d00">حفر 300 / 500 م</text>
      </g>
    </svg>

    <div style="position:absolute;left:12px;top:12px;display:flex;flex-direction:column;gap:8px">
      <button aria-label="تكبير" style="width:44px;height:44px;border-radius:12px;border:1px solid #243445;background:#142030;color:#e8eef4;font-size:22px">+</button>
      <button aria-label="تصغير" style="width:44px;height:44px;border-radius:12px;border:1px solid #243445;background:#142030;color:#e8eef4;font-size:22px">−</button>
    </div>
    <div style="position:absolute;right:12px;top:12px;display:flex;gap:6px;direction:ltr;font-family:ui-monospace,Consolas,monospace;font-size:11px;color:#9fb2c4">
      <span style="background:#101a24cc;padding:4px 8px;border-radius:8px">E 321 874.2</span>
      <span style="background:#101a24cc;padding:4px 8px;border-radius:8px">N 3 339 410.7</span>
    </div>
  </div>

  <div style="background:#101a24;border-top:1px solid #1c2a38;padding:12px 16px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:2px">
        <span style="font-size:15px;font-weight:700">مسار R-14 · ديكت + كابل F36</span>
        <span style="font-size:12px;color:#9fb2c4">التصميم 500 م · المنفذ 300 م (60%) · آخر تحديث أمس</span>
      </div>
      <span style="background:#0f3d2e;color:#7ee0b4;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600">جاري</span>
    </div>
    <div style="height:8px;border-radius:4px;background:#1c2a38;overflow:hidden"><div style="width:60%;height:100%;background:#34d399"></div></div>
    <button style="height:52px;border-radius:14px;border:0;background:#f2a900;color:#2a1d00;font-size:16px;font-weight:700">تحديث شغل اليوم على R-14</button>
  </div>

  <div style="display:grid;grid-template-columns:repeat(7,1fr);background:#0b121a;border-top:1px solid #1c2a38;padding:8px 6px 14px">
    <button style="border:0;background:#f2a90022;color:#ffd166;border-radius:12px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"/></svg>تحديث</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m5 3 14 8-6 2-2 6L5 3Z"/></svg>تحديد</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>تحريك</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 18 10 8l5 6 5-9"/><rect x="2.5" y="16.5" width="3" height="3"/><rect x="8.5" y="6.5" width="3" height="3"/><rect x="18.5" y="3.5" width="3" height="3"/></svg>مسار</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20 20 4M4 20h5M4 20v-5"/></svg>رسم</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 8v8M8 12h8"/></svg>رمز</button>
    <button style="border:0;background:none;color:#aebccb;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M5 6h14M12 6v13M9 19h6"/></svg>Label</button>
  </div>
</div>
</body>
</html>
