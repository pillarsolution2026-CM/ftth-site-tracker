<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الصور الإجبارية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit}
</style>

<meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{background:#e9edf1}</style>
</head>
<body style="display:flex;justify-content:center">

<div dir="rtl" style="width:390px;height:844px;box-sizing:border-box;overflow:hidden;background:#f4f6f8;font-family:'Cairo',system-ui,sans-serif;color:#14202b;display:flex;flex-direction:column">

  <div style="background:#ffffff;border-bottom:1px solid #dde3e9;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px">
    <div style="display:flex;align-items:center;gap:10px">
      <button aria-label="رجوع" style="width:44px;height:44px;border-radius:12px;border:1px solid #dde3e9;background:#fff;color:#14202b;display:flex;align-items:center;justify-content:center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <div style="display:flex;flex-direction:column">
        <span style="font-size:16px;font-weight:700">الصور الإجبارية</span>
        <span style="font-size:12px;color:#51606f">حفر + مايكرو دكت · مسار R-14</span>
      </div>
    </div>
    <div style="display:flex;gap:4px" aria-label="الخطوة 5 من 6">
      <div style="flex:1;height:6px;border-radius:3px;background:#0e8c7f"></div>
      <div style="flex:1;height:6px;border-radius:3px;background:#0e8c7f"></div>
      <div style="flex:1;height:6px;border-radius:3px;background:#0e8c7f"></div>
      <div style="flex:1;height:6px;border-radius:3px;background:#0e8c7f"></div>
      <div style="flex:1;height:6px;border-radius:3px;background:#0e8c7f"></div>
      <div style="flex:1;height:6px;border-radius:3px;background:#c9d2db"></div>
    </div>
    <span style="font-size:13px;color:#51606f">الخطوة 5 من 6 · <b style="color:#14202b">الصور (2 من 4)</b></span>
  </div>

  <div style="flex:1;overflow:hidden;padding:14px 16px;display:flex;flex-direction:column;gap:12px">

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">

      <div style="background:#fff;border:1px solid #dde3e9;border-radius:16px;overflow:hidden;display:flex;flex-direction:column">
        <div style="height:112px;background:linear-gradient(135deg,#6b5b45,#8d7b63);position:relative">
          <span style="position:absolute;bottom:6px;right:6px;background:#000000aa;color:#fff;border-radius:6px;padding:2px 6px;font-size:10px;direction:ltr;font-family:ui-monospace,Consolas,monospace">30.1920N 31.2107E · 08:42</span>
        </div>
        <div style="padding:8px 10px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13px;font-weight:600">الخندق قبل الردم</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a6b61" stroke-width="2.4" aria-label="تم" role="img"><path d="m5 12 5 5L20 7"/></svg>
        </div>
      </div>

      <div style="background:#fff;border:1px solid #dde3e9;border-radius:16px;overflow:hidden;display:flex;flex-direction:column">
        <div style="height:112px;background:linear-gradient(135deg,#4d5f57,#6f857a);position:relative">
          <span style="position:absolute;bottom:6px;right:6px;background:#000000aa;color:#fff;border-radius:6px;padding:2px 6px;font-size:10px;direction:ltr;font-family:ui-monospace,Consolas,monospace">30.1921N 31.2109E · 08:51</span>
        </div>
        <div style="padding:8px 10px;display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13px;font-weight:600">المايكرو دكت في الخندق</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0a6b61" stroke-width="2.4" aria-label="تم" role="img"><path d="m5 12 5 5L20 7"/></svg>
        </div>
      </div>

      <button style="background:#fff;border:2px dashed #0e8c7f;border-radius:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#0a6b61;font-size:13px;font-weight:700">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        تصوير: عمق الخندق
        <span style="font-size:11px;font-weight:400;color:#51606f">إجباري</span>
      </button>

      <button style="background:#fff;border:2px dashed #c9d2db;border-radius:16px;min-height:160px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#51606f;font-size:13px;font-weight:700">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4V8Z"/><circle cx="12" cy="13" r="3.5"/></svg>
        تصوير: بعد الردم
        <span style="font-size:11px;font-weight:400">اختياري</span>
      </button>
    </div>

    <div style="background:#fff;border:1px solid #dde3e9;border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a6b61" stroke-width="2" aria-hidden="true" style="flex:none"><path d="M12 22s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span style="font-size:13px;line-height:1.5">الموقع داخل 12 م من العنصر · دقة GPS ±4 م</span>
    </div>

    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600">ملاحظات
      <input type="text" placeholder="اكتب ملاحظة اختيارية" style="height:48px;border-radius:12px;border:1px solid #c9d2db;background:#fff;padding:0 12px;font-family:inherit;font-size:14px">
    </label>
  </div>

  <div style="background:#fff;border-top:1px solid #dde3e9;padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px">
    <span style="font-size:12px;color:#8a3b00;text-align:center">الحفظ مقفول لحد ما الصورة الإجبارية «عمق الخندق» تتصوّر</span>
    <div style="display:flex;gap:10px">
      <button style="flex:1;height:52px;border-radius:14px;border:1px solid #c9d2db;background:#fff;font-size:15px;font-weight:600;color:#14202b">رجوع</button>
      <button disabled style="flex:2;height:52px;border-radius:14px;border:0;background:#c9d2db;font-size:16px;font-weight:700;color:#51606f">التالي: مراجعة وحفظ</button>
    </div>
  </div>
</div>
</body>
</html>
