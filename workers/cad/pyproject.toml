[project]
name = "cad-worker"
version = "0.1.0"
description = "FTTH Site Tracker server-side CAD worker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ezdxf",
    "pyproj",
    "shapely",
    "redis",
    "pydantic",
    "pydantic-settings",
    "psycopg[binary]",
    "boto3>=1.43.119",
    "pmtiles>=3.8.1",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pytest-cov"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cad_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]  # long SQL / sample strings

[tool.mypy]
strict = true
python_version = "3.12"
files = ["cad_worker", "tests"]

# Ignores only for third-party libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["ezdxf", "ezdxf.*", "shapely", "shapely.*", "boto3", "botocore", "botocore.*"]
ignore_missing_imports = true

# pmtiles ships py.typed but most of its functions are unannotated: treat it as untyped.
[[tool.mypy.overrides]]
module = ["pmtiles", "pmtiles.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
