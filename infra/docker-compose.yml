# Local development stack. Every value has a dev default; override via infra/.env (see .env.example).
#   docker compose -f infra/docker-compose.yml up -d postgis redis minio minio-init martin api
# DEV ONLY: all published ports bind to 127.0.0.1 and every secret has a weak default.
# The production compose (Phase 7) must require secrets with `${VAR:?}` (no defaults), e.g.
#   JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}   REDIS_PASSWORD: ${REDIS_PASSWORD:?}
# and must not publish postgis/redis/minio/martin ports at all.
# Seed data is NOT loaded automatically: docker compose -f infra/docker-compose.yml run --rm -e ALLOW_DEV_SEED=true api node dist/db/seed.js
# `worker` and `web` build images owned by other modules (workers/cad, apps/web) and are started on demand.
name: ftth

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-ftth}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftth}
      POSTGRES_DB: ${POSTGRES_DB:-ftth}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-ftth-redis-dev}']
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ftth-redis-dev}
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket, then exits 0.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ftth}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "

  # Vector tiles straight from PostGIS tables/functions (auto-discovered).
  # DEV ONLY: tiles are unauthenticated and auto-publish tables, so it is bound to loopback until
  # tile access is gated (see "Tiles security" in docs/ROADMAP.md Phase 1).
  martin:
    image: ghcr.io/maplibre/martin:latest
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-ftth}@postgis:5432/${POSTGRES_DB:-ftth}
    ports:
      - '127.0.0.1:3002:3000'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      # Phase 0 API only talks to Postgres; redis/minio join this list when queues/uploads land.
      postgis:
        condition: service_healthy
    environment:
      <<: *s3-env
      # Seeding is a separate one-off command (needs ALLOW_DEV_SEED=true), never part of startup.
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-ftth}@postgis:5432/${POSTGRES_DB:-ftth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ftth-redis-dev}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    command:
      - sh
      - -c
      - node dist/db/migrate.js && exec node dist/main.js
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Placeholder: the CAD worker image is created by the workers/cad module.
  worker:
    build:
      context: ../workers/cad
      dockerfile: Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *s3-env
      DATABASE_URL: postgres://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-ftth}@postgis:5432/${POSTGRES_DB:-ftth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ftth-redis-dev}@redis:6379

  # The web image is created by the apps/web module.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
    ports:
      - '3000:3000'

volumes:
  postgis-data:
  minio-data:
