# Local development stack. Every value has a dev default; override via infra/.env (see .env.example).
#   docker compose -f infra/docker-compose.yml up -d postgis redis minio minio-init martin api
# DEV ONLY: all published ports bind to 127.0.0.1 and every secret has a weak default.
# The production compose (Phase 7) must require secrets with `${VAR:?}` (no defaults), e.g.
#   JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}   REDIS_PASSWORD: ${REDIS_PASSWORD:?}
# and must not publish postgis/redis/minio/martin ports at all.
# Seed data is NOT loaded automatically: docker compose -f infra/docker-compose.yml run --rm -e ALLOW_DEV_SEED=true api node dist/db/seed.js
# `worker` and `web` build images owned by other modules (workers/cad, apps/web) and are started on demand.
name: ftth

# Files (CAD originals, PDFs, xlsx) live on the `ftth-storage` volume shared by api and worker (ADR-012).
# MinIO stays available for the s3 driver (STORAGE_DRIVER=s3).
x-storage-env: &storage-env
  STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
  STORAGE_FS_ROOT: /var/lib/ftth/storage
x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-ftth}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ftth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ftth}
      POSTGRES_DB: ${POSTGRES_DB:-ftth}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:-ftth-redis-dev}']
    ports:
      - '127.0.0.1:6379:6379'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-ftth-redis-dev}
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: creates the bucket, then exits 0.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-ftth}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET}
      "

  # One-shot, DEV ONLY: gives the restricted tile role (created by migration 0005, which the api runs
  # at startup) a login password. Production sets it once by hand: see "Tiles (Phase 1b)" in docs/DEPLOY.md.
  tiles-role-init:
    image: postgis/postgis:16-3.4
    depends_on:
      api:
        condition: service_healthy
    restart: 'no'
    environment:
      PGHOST: postgis
      PGUSER: ${POSTGRES_USER:-ftth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ftth}
      PGDATABASE: ${POSTGRES_DB:-ftth}
      FTTH_TILES_PASSWORD: ${FTTH_TILES_PASSWORD:-ftth-tiles-dev}
    entrypoint: >
      /bin/sh -c "
      echo \"ALTER ROLE ftth_tiles LOGIN PASSWORD :'pw'\" | psql -v ON_ERROR_STOP=1 -v pw=\"$$FTTH_TILES_PASSWORD\"
      "

  # Vector tiles (ADR-021). Reads only through tiles.design_features as role ftth_tiles; config in
  # infra/martin/config.yaml (auto_publish: false). The image tag stays `latest` because no version
  # could be verified here: pin one after the first successful run.
  # DEV ONLY: bound to loopback and WITHOUT the Caddy forward_auth signature check, so anyone on this
  # machine can read tiles for any project/revision id they know.
  martin:
    image: ghcr.io/maplibre/martin:latest
    command: ['--config', '/config/config.yaml']
    depends_on:
      tiles-role-init:
        condition: service_completed_successfully
    environment:
      TILES_DATABASE_URL: postgres://ftth_tiles:${FTTH_TILES_PASSWORD:-ftth-tiles-dev}@postgis:5432/${POSTGRES_DB:-ftth}
    volumes:
      - ./martin/config.yaml:/config/config.yaml:ro
    ports:
      - '127.0.0.1:3002:3000'

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: [*s3-env, *storage-env]
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      # Seeding is a separate one-off command (needs ALLOW_DEV_SEED=true), never part of startup.
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-ftth}@postgis:5432/${POSTGRES_DB:-ftth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ftth-redis-dev}@redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-secret-change-me-dev-only-secret-change-me}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Signed tile URLs (ADR-021). DEV ONLY default secret; production generates its own (docs/DEPLOY.md).
      TILE_URL_SECRET: ${TILE_URL_SECRET:-dev-only-tile-secret-change-me-dev-only-tile-secret}
      TILES_PUBLIC_URL: ${TILES_PUBLIC_URL:-http://localhost:3002}
    command:
      - sh
      - -c
      - node dist/db/migrate.js && exec node dist/main.js
    volumes:
      # Owned by the image's `node` user (see apps/api/Dockerfile), so a fresh volume is writable.
      - ftth-storage:/var/lib/ftth/storage
    ports:
      - '3001:3001'
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  # Placeholder: the CAD worker image is created by the workers/cad module.
  worker:
    build:
      context: ../workers/cad
      dockerfile: Dockerfile
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # The API (user `node`, uid/gid 1000) creates the group-writable directories; the worker (uid 10001)
    # joins gid 1000 so it can write converted files next to the originals.
    group_add:
      - '1000'
    volumes:
      - ftth-storage:/var/lib/ftth/storage
    environment:
      <<: [*s3-env, *storage-env]
      DATABASE_URL: postgres://${POSTGRES_USER:-ftth}:${POSTGRES_PASSWORD:-ftth}@postgis:5432/${POSTGRES_DB:-ftth}
      REDIS_URL: redis://:${REDIS_PASSWORD:-ftth-redis-dev}@redis:6379
      WORKER_ID: ${WORKER_ID:-worker-1}

  # The web image is created by the apps/web module.
  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
    ports:
      - '3000:3000'

volumes:
  postgis-data:
  minio-data:
  ftth-storage:
