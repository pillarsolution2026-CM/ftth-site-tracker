# Staging stack on the shared Hetzner server (ADR-010), next to other apps.
# TLS and routing are done by the host's Caddy (ftthtracker.caddy is imported into /etc/caddy/Caddyfile);
# this stack only publishes web and api on 127.0.0.1. Data services stay on the internal network.
# Run by /usr/local/bin/ftth-deploy with --env-file /srv/ftth/.env (see .env.example); no secret defaults.
name: ftth-staging

x-db-url: &db-url postgres://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgis:5432/${POSTGRES_DB:?}
x-redis-url: &redis-url redis://:${REDIS_PASSWORD:?}@redis:6379
x-s3-env: &s3-env
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_BUCKET: ${S3_BUCKET:?}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?}

services:
  postgis:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?}', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}

  api:
    image: ${IMAGE_REGISTRY:?}/api:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      <<: *s3-env
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: *db-url
      REDIS_URL: *redis-url
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_ACCESS_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 30
      CORS_ORIGINS: https://${APP_DOMAIN:?}
    ports:
      - '127.0.0.1:${API_PORT:?}:3001'
    command: ['sh', '-c', 'node dist/db/migrate.js && exec node dist/main.js']
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:?}/web:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3001
      APP_ORIGIN: https://${APP_DOMAIN:?}
    ports:
      - '127.0.0.1:${WEB_PORT:?}:3000'

  worker:
    image: ${IMAGE_REGISTRY:?}/cad-worker:${IMAGE_TAG:?}
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *s3-env
      DATABASE_URL: *db-url
      REDIS_URL: *redis-url

  # Nightly logical backup kept on the server (7 days). Off-site WAL archiving comes in Phase 7.
  backup:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - ${BACKUP_DIR:?}:/backups
    entrypoint:
      - sh
      - -c
      - >
        while true; do
          pg_dump -h postgis -U ${POSTGRES_USER} -d ${POSTGRES_DB} -Fc -f /backups/ftth-$$(date +%F).dump &&
          find /backups -name 'ftth-*.dump' -mtime +7 -delete;
          sleep 86400;
        done

volumes:
  postgis-data:
  redis-data:
