#cloud-config
# Paste into "Cloud config" when creating the Hetzner Cloud server (Ubuntu 24.04).
# Replace the two ssh_authorized_keys lines with your own key and the GitHub Actions deploy key.
users:
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    ssh_authorized_keys:
      - ssh-ed25519 AAAA...your-personal-key
      - ssh-ed25519 AAAA...github-actions-deploy-key

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - ufw
  - fail2ban
  - unattended-upgrades

write_files:
  - path: /etc/ssh/sshd_config.d/10-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
  - path: /etc/docker/daemon.json
    content: |
      { "log-driver": "json-file", "log-opts": { "max-size": "20m", "max-file": "5" } }

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw allow 443/udp
  - ufw --force enable
  - systemctl enable --now docker fail2ban
  - systemctl restart ssh
  - install -d -o deploy -g deploy -m 750 /opt/ftth /opt/ftth/backups
