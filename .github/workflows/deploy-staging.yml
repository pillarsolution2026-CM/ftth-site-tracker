name: Deploy staging

# Builds the three images, pushes them to GHCR and deploys to the shared Hetzner staging server
# through the ftth-deploy forced command (infra/staging/deploy.sh).
# Runs only when the repository variable STAGING_HOST is set (see docs/DEPLOY.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  images:
    if: ${{ vars.STAGING_HOST != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            context: .
            dockerfile: apps/api/Dockerfile
          - name: web
            context: .
            dockerfile: apps/web/Dockerfile
          - name: cad-worker
            context: workers/cad
            dockerfile: workers/cad/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Lower-case registry path
        run: echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
            ${{ env.IMAGE_REGISTRY }}/${{ matrix.name }}:staging
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.ftthtracker.projectflow.site
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Deploy (forced command on the server)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s\n' "$GHCR_TOKEN" | ssh -o BatchMode=yes -i ~/.ssh/id_ed25519 \
            "ftth-deploy@${{ vars.STAGING_HOST }}" "deploy ${{ github.sha }} ${{ github.actor }}"
      - name: Smoke test
        run: |
          curl --fail --retry 10 --retry-delay 6 --retry-all-errors \
            https://api.staging.ftthtracker.projectflow.site/health
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null \
            https://staging.ftthtracker.projectflow.site/ar/login
