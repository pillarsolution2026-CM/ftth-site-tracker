name: Deploy

# Builds web (Next standalone) and api (pnpm deploy --prod) on the runner, uploads one tarball over SSH to the
# shared server and activates it with infra/remote-deploy.sh. Never triggered by pull_request (public repo).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    # No secrets in this job.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile --filter "@ftth/web..." --filter "@ftth/api..."
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm --filter @ftth/shared --filter @ftth/i18n --filter @ftth/ui-tokens build
          pnpm --filter @ftth/web build
          pnpm --filter @ftth/api build
      - name: Assemble release
        run: |
          stage="$RUNNER_TEMP/stage"
          mkdir -p "$stage/web" "$stage/api"
          cp -r apps/web/.next/standalone/. "$stage/web/"
          mkdir -p "$stage/web/apps/web/.next"
          cp -r apps/web/.next/static "$stage/web/apps/web/.next/static"
          cp -r apps/web/public "$stage/web/apps/web/public"
          pnpm --filter @ftth/api deploy --legacy --prod "$stage/api"
          cp -r apps/api/dist "$stage/api/dist"
          tar -czf "$RUNNER_TEMP/release.tgz" -C "$stage" .
          ls -lh "$RUNNER_TEMP/release.tgz"
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release.tgz
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}

      - name: Check secrets
        env:
          FTTH_HOST: ${{ secrets.FTTH_HOST }}
          FTTH_USER: ${{ secrets.FTTH_USER }}
          FTTH_SSH_KEY: ${{ secrets.FTTH_SSH_KEY }}
          FTTH_KNOWN_HOSTS: ${{ secrets.FTTH_KNOWN_HOSTS }}
        run: |
          for v in FTTH_HOST FTTH_USER FTTH_SSH_KEY FTTH_KNOWN_HOSTS; do
            [ -n "${!v}" ] || { echo "::error::secret $v is missing"; exit 1; }
          done

      - name: Upload and activate release
        env:
          FTTH_HOST: ${{ secrets.FTTH_HOST }}
          FTTH_USER: ${{ secrets.FTTH_USER }}
          FTTH_SSH_KEY: ${{ secrets.FTTH_SSH_KEY }}
          FTTH_KNOWN_HOSTS: ${{ secrets.FTTH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$FTTH_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$FTTH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          SSH=(ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
               -o BatchMode=yes -o ConnectTimeout=20 "$FTTH_USER@$FTTH_HOST")
          "${SSH[@]}" "mkdir -p /srv/ftthtracker/incoming && cat > /srv/ftthtracker/incoming/$RELEASE_SHA.tgz" \
            < "$RUNNER_TEMP/release.tgz"
          "${SSH[@]}" "bash -s -- $RELEASE_SHA" < infra/remote-deploy.sh

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
